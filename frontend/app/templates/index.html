<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Facturas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Generador de Facturas PDF</h1>
        <form id="factura-form" method="POST" action="/generar-pdf">
            <div class="form-group">
                <label for="id_factura">ID de Factura:</label>
                <input type="text" id="id_factura" name="id_factura" required>
            </div>
            <button type="submit">Generar PDF</button>
        </form>

        <div class="alert" id="preview-error" style="display:none;"></div>

        <div id="preview-container" class="preview-container" style="display:none;">
            <div class="preview-actions">
                <h2>Vista previa de la factura</h2>
                <a id="download-link" class="download-link" href="#" target="_blank">Descargar PDF</a>
            </div>
            <iframe id="pdf-preview" class="pdf-preview" title="Vista previa PDF"></iframe>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
